name: Refresh community events and food help
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_community.py'
      - '.github/workflows/refresh-community.yml'
permissions:
  contents: write
concurrency:
  group: community-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official public sources
        run: python scripts/refresh_community.py
      - name: Save fresh directory
        run: |
          git add assets/community-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh community events and food-help listings"
          git pull --rebase origin main
          git push origin HEAD:main
# The browser reads this committed JSON from raw.githubusercontent.com, with a
# bundled Pages fallback. GITHUB_TOKEN commits need not trigger a Pages rebuild.
